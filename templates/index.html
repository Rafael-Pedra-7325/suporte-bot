<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuporteBot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="chat-widget">
    <div class="chat-header">
      <span class="status-dot"></span>
      SuporteBot
    </div>

    <div class="chat-mensagens" id="mensagens">
      <div class="mensagem bot">
        Olá! 👋 Sou o assistente virtual. Pergunte sobre horários, contato, preços ou relate um problema.
      </div>
    </div>

    <form id="form-chat" class="chat-form">
      <input type="text" id="input-mensagem" placeholder="Digite sua mensagem..." autocomplete="off" required />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
